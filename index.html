<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在庫管理</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>在庫管理</h1></header>
<nav class="tabs"><button class="tab-button active" data-tab="inventory">在庫</button><button class="tab-button" data-tab="shopping">買うもの</button><button class="tab-button" data-tab="add">商品登録</button><button class="tab-button" data-tab="other">その他</button></nav>
<main>
<section id="inventory" class="tab-content active"><h2>在庫一覧</h2><div class="filter-area"><label>カテゴリ<select id="categoryFilter"><option>すべて</option><option>食品</option><option>日用品</option></select></label><label>検索<input id="searchInput" placeholder="商品名を入力"></label></div><div id="inventoryList"></div></section>
<section id="shopping" class="tab-content"><h2>買うもの</h2><div id="shoppingList"></div></section>
<section id="add" class="tab-content"><h2>商品登録</h2><form id="productForm"><label>商品名<input id="productName" required placeholder="例：牛乳"></label><label>カテゴリ<select id="category"><option value="食品">食品</option><option value="日用品">日用品</option></select></label><label>現在庫<input id="stock" type="number" min="0" value="0" required></label><label>最低在庫<input id="minimumStock" type="number" min="0" value="1" required></label><div><strong>買う場所（複数選択可）</strong><div id="shopCheckboxes" class="checkbox-list"></div><p class="help-text">「その他」で買う場所を登録できます。</p></div><button class="primary-button">商品を登録</button></form></section>
<section id="other" class="tab-content"><h2>その他</h2><div class="card"><h3>データ管理</h3><button id="backupButton" class="menu-button">全データをバックアップ</button><button id="restoreButton" class="menu-button">バックアップから復元</button><input id="restoreFile" type="file" accept=".json,application/json" hidden></div><div class="card"><h3>買う場所マスタ</h3><form id="shopForm" class="shop-form"><input id="shopName" required placeholder="例：スーパー"><button class="add-button">追加</button></form><div id="shopMasterList"></div></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-content"><button id="closeModal" class="close-button">×</button><div id="modalBody"></div></div></div><script src="script.js"></script></body></html>
